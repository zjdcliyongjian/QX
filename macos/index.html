<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>七夕浪漫3D爱心粒子</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #040716; }
    body { font-family: "STXingkai", "Kaiti SC", "Songti SC", serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #close {
      position: fixed;
      z-index: 4;
      top: max(20px, env(safe-area-inset-top));
      right: max(22px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
      color: rgba(255, 255, 255, .92);
      background: rgba(5, 5, 18, .28);
      font: 300 31px/40px -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background .18s ease, transform .18s ease, border-color .18s ease;
    }
    #close:hover { background: rgba(127, 77, 181, .42); border-color: rgba(255,255,255,.9); transform: scale(1.05); }
    #close:focus-visible { outline: 2px solid #ffd5f0; outline-offset: 4px; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="紫蓝星空中，由上升粒子汇聚成的三维粉紫爱心"></canvas>
  <button id="close" type="button" aria-label="关闭">×</button>
  <script>
    (() => {
      'use strict';

      const canvas = document.querySelector('#scene');
      const ctx = canvas.getContext('2d', { alpha: false });
      const closeButton = document.querySelector('#close');
      const TAU = Math.PI * 2;
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let width = 1600;
      let height = 900;
      let dpr = 1;
      let startTime = performance.now();

      const random = mulberry32(20260818);
      const stars = Array.from({ length: 140 }, () => ({
        x: random(), y: random(), r: .35 + random() * 1.45,
        phase: random() * TAU, speed: .35 + random() * .8,
        warm: random() > .76
      }));

      const pool = Array.from({ length: 1750 }, (_, index) => {
        const radius = Math.sqrt(random());
        const angle = random() * TAU;
        return {
          radius,
          angle,
          lift: Math.pow(random(), 2.8),
          phase: random() * TAU,
          size: index % 17 === 0 ? 2.1 + random() * 2.8 : .65 + random() * 1.35,
          bright: index % 17 === 0
        };
      });

      const risers = Array.from({ length: 560 }, (_, index) => ({
        x: random() * 2 - 1,
        drift: random() * 2 - 1,
        phase: random() * 3.8,
        sway: random() * TAU,
        size: index % 19 === 0 ? 3.0 + random() * 4.2 : .9 + random() * 2.0,
        bright: index % 19 === 0
      }));

      const heart = Array.from({ length: 5200 }, (_, index) => {
        const t = random() * TAU;
        const radius = index < 900 ? .92 + random() * .08 : Math.pow(random(), .42);
        const hx = 16 * Math.pow(Math.sin(t), 3) / 17;
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17;
        const edge = Math.max(.18, 1 - Math.abs(hy + .08) * .38);
        const depthLimit = .50 * Math.sqrt(Math.max(0, 1 - radius * radius * .72)) * edge;
        return {
          x: hx * radius,
          y: hy * radius,
          z: (random() * 2 - 1) * depthLimit,
          reveal: index < 900 ? random() * .20 : .18 + random() * .82,
          phase: random() * TAU,
          size: index % 31 === 0 ? 2.1 + random() * 2.8 : .58 + random() * 1.25,
          bright: index % 31 === 0
        };
      });

      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = seed + 0x6D2B79F5 | 0;
          let value = Math.imul(seed ^ seed >>> 15, 1 | seed);
          value = value + Math.imul(value ^ value >>> 7, 61 | value) ^ value;
          return ((value ^ value >>> 14) >>> 0) / 4294967296;
        };
      }

      function clamp(value, min = 0, max = 1) { return Math.max(min, Math.min(max, value)); }
      function smooth(a, b, value) {
        const x = clamp((value - a) / (b - a));
        return x * x * (3 - 2 * x);
      }
      function fract(value) { return value - Math.floor(value); }

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = innerWidth;
        height = innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function drawBackground(time) {
        const base = ctx.createLinearGradient(0, 0, 0, height);
        base.addColorStop(0, '#040716');
        base.addColorStop(.46, '#09091f');
        base.addColorStop(.76, '#120a2b');
        base.addColorStop(1, '#1a0b31');
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, width, height);

        const glow = ctx.createRadialGradient(width * .5, height * .45, 0, width * .5, height * .45, width * .48);
        glow.addColorStop(0, 'rgba(101, 50, 145, .105)');
        glow.addColorStop(.45, 'rgba(50, 26, 92, .055)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-width * .12, height * (.19 + Math.sin(time * .10) * .018));
        ctx.bezierCurveTo(width * .22, height * .47, width * .66, -height * .04, width * 1.12, height * .21);
        ctx.strokeStyle = 'rgba(163, 91, 212, .045)';
        ctx.lineWidth = height * .10;
        ctx.stroke();
        ctx.strokeStyle = 'rgba(219, 115, 204, .052)';
        ctx.lineWidth = height * .026;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-width * .1, height * .74);
        ctx.bezierCurveTo(width * .23, height * .91, width * .72, height * .43, width * 1.1, height * .67);
        ctx.strokeStyle = 'rgba(101, 55, 186, .038)';
        ctx.lineWidth = height * .075;
        ctx.stroke();
        ctx.restore();

        for (const star of stars) {
          const twinkle = .34 + .66 * Math.pow(.5 + .5 * Math.sin(time * star.speed + star.phase), 2);
          ctx.fillStyle = star.warm
            ? `rgba(255, 194, 224, ${.30 * twinkle})`
            : `rgba(194, 176, 255, ${.34 * twinkle})`;
          ctx.beginPath();
          ctx.arc(star.x * width, star.y * height, star.r, 0, TAU);
          ctx.fill();
        }

        const vignette = ctx.createRadialGradient(width * .5, height * .48, width * .18, width * .5, height * .48, width * .78);
        vignette.addColorStop(.5, 'rgba(0,0,0,0)');
        vignette.addColorStop(1, 'rgba(0,0,10,.48)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);
      }

      function particle(x, y, radius, color, alpha, glow = 0) {
        if (alpha <= .01 || radius <= .05) return;
        ctx.globalAlpha = alpha;
        if (glow > 0) {
          ctx.shadowColor = color;
          ctx.shadowBlur = glow;
        }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }

      function drawPool(time, fade) {
        const cx = width * .5;
        const cy = height * .825;
        const rx = Math.min(width * .39, height * .68);
        const ry = height * .064;
        const rotation = time * .13;

        const poolGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
        poolGlow.addColorStop(0, `rgba(124, 79, 255, ${.105 * fade})`);
        poolGlow.addColorStop(.48, `rgba(83, 43, 190, ${.055 * fade})`);
        poolGlow.addColorStop(1, 'rgba(20, 8, 68, 0)');
        ctx.fillStyle = poolGlow;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, .18);
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, TAU);
        ctx.fill();
        ctx.restore();

        for (const item of pool) {
          const angle = item.angle + rotation * (item.radius < .52 ? -1.25 : .72);
          const ripple = 1 + .025 * Math.sin(time * 2.2 + item.phase + item.radius * 11);
          const x = cx + Math.cos(angle) * rx * item.radius * ripple;
          const y = cy + Math.sin(angle) * ry * item.radius - item.lift * height * .022;
          const sparkle = .48 + .52 * Math.sin(time * 3 + item.phase) ** 2;
          particle(x, y, item.size * (.72 + item.radius * .42), item.bright ? '#f6eaff' : '#8e67ff', fade * (.23 + sparkle * .58), item.bright ? 9 : 0);
        }
      }

      function drawRisers(time, fade) {
        const poolY = height * .82;
        const topY = height * .33;
        const active = .36 * smooth(.08, 1.3, time) + .64 * smooth(.65, 3.6, time);
        const settle = 1 - .45 * smooth(5.15, 6.15, time);
        const count = Math.floor(risers.length * active * settle);

        for (let index = 0; index < count; index++) {
          const item = risers[index];
          const p = fract((time * (.40 + (index % 7) * .012) + item.phase) / 2.65);
          const eased = 1 - Math.pow(1 - p, 1.38);
          const funnel = .95 - eased * .76;
          const x = width * .5 + item.x * width * .25 * funnel + Math.sin(item.sway + time * 2.1) * (8 + 22 * (1 - eased));
          const y = poolY + (topY - poolY) * eased - Math.sin(p * Math.PI) * height * .035;
          const alpha = smooth(0, .12, p) * (1 - smooth(.72, 1, p)) * fade;
          const mix = smooth(.2, .88, eased);
          const color = item.bright ? '#fff1ff' : mix > .53 ? '#f35aa8' : '#a06bff';
          particle(x, y, item.size * (1 - eased * .28), color, alpha * (item.bright ? .86 : .58), item.bright ? 11 : 0);
        }
      }

      function drawHeart(time, fade) {
        const cx = width * .5;
        const cy = height * .385;
        const scale = Math.min(width * .20, height * .36);
        const fill = smooth(.7, 4.12, time);
        const postDensity = .72 + .28 * smooth(4.1, 7.1, time);
        const rotation = time < 5.2 ? 0 : (time - 5.2) * 1.22;
        const pulse = 1 + Math.sin(time * 2.15) * .009 + Math.sin(time * 4.3) * .0035;
        const heartbeat = 1 + .055 * Math.exp(-Math.pow((time - 4.25) / .15, 2));
        const sinR = Math.sin(rotation);
        const cosR = Math.cos(rotation);

        for (const item of heart) {
          if (item.reveal > fill * postDensity) continue;
          const rotatedX = item.x * cosR + item.z * sinR;
          const rotatedZ = -item.x * sinR + item.z * cosR;
          const perspective = 1 / (1.08 - rotatedZ * .26);
          const x = cx + rotatedX * scale * pulse * heartbeat * perspective;
          const y = cy + item.y * scale * pulse * heartbeat * perspective;
          const depth = clamp((rotatedZ + .58) / 1.16);
          const twinkle = .53 + .47 * Math.sin(time * 2.7 + item.phase) ** 2;
          const alpha = fade * (.28 + depth * .56) * (.68 + twinkle * .32);
          const radius = item.size * (.70 + depth * .72) * perspective;
          const color = item.bright ? '#ffe9f8' : depth > .54 ? '#ff65b4' : '#b8409b';
          particle(x, y, radius, color, alpha, item.bright ? 12 : 0);
        }

        const textAlpha = smooth(4.30, 4.88, time) * fade;
        if (textAlpha > .01) {
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = `700 ${Math.max(34, Math.min(58, height * .055))}px "STXingkai", "Kaiti SC", serif`;
          ctx.shadowColor = 'rgba(255, 80, 177, .95)';
          ctx.shadowBlur = 18;
          ctx.fillStyle = `rgba(255, 244, 251, ${textAlpha})`;
          ctx.fillText('七夕快乐', cx, cy + height * .075);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = `rgba(255, 115, 190, ${textAlpha * .78})`;
          ctx.lineWidth = 1.1;
          ctx.strokeText('七夕快乐', cx, cy + height * .075);
          ctx.restore();
        }
      }

      function frame(now) {
        const elapsed = (now - startTime) / 1000;
        const time = reduceMotion ? 5.2 : elapsed % 10;
        const fade = 1 - smooth(8.75, 9.92, time);
        drawBackground(time);
        drawPool(time, fade);
        drawRisers(time, fade);
        drawHeart(time, fade);
        requestAnimationFrame(frame);
      }

      closeButton.addEventListener('click', () => {
        if (window.webkit?.messageHandlers?.app) window.webkit.messageHandlers.app.postMessage('close');
        else window.close();
      });
      addEventListener('keydown', event => {
        if (event.key === 'Escape') closeButton.click();
      });
      addEventListener('resize', resize);

      window.setMusicUrl = url => {
        const audio = new Audio(url);
        audio.loop = true;
        audio.volume = .72;
        audio.play().catch(() => {});
      };

      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
